<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오윤영 디지털 명함</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#1b2a6b;
    --navy-dark:#101c4a;
    --green:#4caf50;
    --ink:#1a1a1a;
    --sub:#6b6f7a;
    --bg:#eef1f8;
    --card-bg:#ffffff;
    --qr-bg:#f5f7fb;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
  }

  .top-bar{
    grid-column:1/-1;
    height:7px;
    background:linear-gradient(90deg, var(--navy) 0%, var(--navy) 55%, var(--green) 100%);
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 14px 40px rgba(16,28,74,0.16);
    display:grid;
    grid-template-columns:1fr;
    animation:cardEnter .6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardEnter{
    from{ opacity:0; transform:translateY(28px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }

  /* ---- info panel ---- */
  .panel-info{
    min-width:0;
    padding:30px 26px 26px;
  }
  .lang-row{
    display:flex;
    justify-content:flex-end;
    margin:0 0 16px;
  }
  .lang-seg{
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:11.5px;
    font-weight:800;
    padding:5px 13px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .lang-seg:first-child{ border-radius:999px 0 0 999px; border-right:none; }
  .lang-seg:last-child{ border-radius:0 999px 999px 0; }
  .lang-seg.active{ background:var(--navy); color:#fff; }
  .lang-seg:active{ transform:scale(.94); }
  .logo-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:0 0 18px;
  }
  .logo-badge{
    flex-shrink:0;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:none;
  }
  .logo-initial{
    color:var(--navy);
    font-size:24px;
    font-weight:800;
    line-height:1;
  }
  .name{
    font-size:clamp(26px, 7vw, 30px);
    font-weight:800;
    color:var(--navy-dark);
    letter-spacing:0.3px;
    margin:0 0 6px;
  }
  .title-main{
    font-size:clamp(15px, 4vw, 16.5px);
    font-weight:700;
    color:var(--ink);
    margin:0 0 12px;
    line-height:1.45;
  }
  .biz-list{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0;
    margin:0 0 18px;
  }
  .biz-list li{
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    background:rgba(27,42,107,0.08);
    padding:5px 12px;
    border-radius:999px;
  }
  .logo-text{
    min-width:0;
  }
  .logo-tagline{
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    margin:0 0 3px;
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .logo-org{
    font-size:14.5px;
    font-weight:800;
    color:var(--navy-dark);
    margin:0;
    line-height:1.3;
  }
  .divider{
    height:1px;
    background:#e7e9f2;
    margin:0 0 18px;
  }
  .contact-block p{
    font-size:13.5px;
    color:var(--sub);
    margin:0 0 7px;
    line-height:1.5;
    word-break:break-all;
  }
  .contact-block p strong{
    color:var(--ink);
    font-weight:600;
  }
  .contact-block .c-label{
    display:inline-flex;
    width:18px;
    color:var(--navy);
    vertical-align:-3px;
  }
  .copy-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    margin-left:6px;
    border:none;
    background:rgba(27,42,107,0.08);
    color:var(--navy);
    border-radius:6px;
    cursor:pointer;
    vertical-align:-6px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .copy-btn:active{ background:rgba(27,42,107,0.18); transform:scale(.9); }
  .c-label svg, .btn svg, .btn-save svg, .copy-btn svg{
    width:15px;
    height:15px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 10px;
    border-radius:13px;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    border:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .btn-call{ background:var(--navy); color:#fff; }
  .btn-mail{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn:active{ transform:scale(.96); }
  .qr-org{
    font-size:12.5px;
    color:var(--navy);
    font-weight:700;
    text-align:center;
    margin:20px 0 0;
  }
  .btn-web{
    color:var(--navy);
    text-decoration:none;
    font-weight:600;
  }

  /* ---- qr panel ---- */
  .panel-qr{
    min-width:0;
    background:var(--qr-bg);
    padding:26px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-top:1px solid #e7e9f2;
  }
  #qrcode{
    background:#fff;
    padding:12px;
    border-radius:16px;
    border:1px solid #e3e6f0;
    line-height:0;
  }
  #qrcode svg{
    display:block;
    width:190px;
    height:190px;
  }
  .qr-hint{
    font-size:12px;
    color:var(--sub);
    margin:12px 0 0;
    text-align:center;
  }

  /* ---- save-as-image ---- */
  .save-row{
    grid-column:1/-1;
    padding:0 26px 26px;
    border-top:1px solid #e7e9f2;
  }
  .btn-save{
    width:100%;
    margin-top:18px;
    padding:13px;
    border-radius:13px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .btn-save:disabled{ opacity:.6; cursor:default; }
  .btn-save:not(:disabled):active{ transform:scale(.97); }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(12px);
    background:var(--navy-dark);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:9999;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    max-width:88vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- wide screens: side-by-side like a real business card ---- */
  @media (min-width:640px){
    .card{
      max-width:680px;
      grid-template-columns:1.35fr 1fr;
    }
    .panel-info{
      padding:38px 34px;
    }
    .panel-qr{
      border-top:none;
      border-left:1px solid #e7e9f2;
      padding:34px;
    }
    .save-row{
      padding:0 34px 30px;
    }
  }
</style>
</head>

      <p><span class="c-label"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span id="txtAddr">33447 충남 보령시 주교면 보령북로 404</span></p>

    <div class="btn-row">
      <a class="btn btn-call" href="tel:01045488085"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> <span id="txtCallBtn">전화 걸기</span></a>
      <a class="btn btn-mail" href="mailto:slp1915@gmail.com"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg> <span id="txtMailBtn">이메일</span></a>
    </div>
    <p class="qr-org"><span id="txtSlogan">사랑으로 채우는 세상</span> · <a class="btn-web" href="http://www.westrc.or.kr" target="_blank" rel="noopener">www.westrc.or.kr</a></p>
  </div>

  <div class="panel-qr">
    <div id="qrcode"></div>
    <p class="qr-hint">📷 <span id="txtQrHint">스캔하면 연락처가 저장돼요</span></p>
  </div>

  <div class="save-row">
    <button type="button" id="saveCardBtn" class="btn-save">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="txtSaveBtn">명함 이미지로 저장</span>
    </button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // ====================================================================
  // ⚠️ 번역 검수 필요: CONTENT.en 안의 name(이름 로마자 표기),
  // org / vcardOrg(회사 공식 영문명), title / vcardTitle(직위 번역)은
  // 초안입니다. 실제 사용 전 꼭 확인하고 필요하면 아래 값을 고쳐주세요.
  // ====================================================================
  var CONTENT = {
    ko: {
      tagline: '장애인의 "개성있는 삶"에 동행협업합니다⁠~',
      org: '충청남도서부장애인종합복지관',
      name: '오윤영',
      title: 'ID&R지원단 팀장 · 책임언어재활사',
      biz: ['언어활동'],
      faxLabel: '팩스',
      addr: '33447 충남 보령시 주교면 보령북로 404',
      slogan: '사랑으로 채우는 세상',
      qrHint: '스캔하면 연락처가 저장돼요',
      callBtn: '전화 걸기',
      mailBtn: '이메일',
      saveBtn: '명함 이미지로 저장',
      saveBtnBusy: '이미지 생성 중...',
      shareTitle: '오윤영 디지털 명함',
      fileName: '오윤영_디지털명함.png',
      toastCopied: '복사했어요',
      toastCopyFail: '복사에 실패했어요',
      toastSaved: '저장했어요 — 다운로드 폴더 확인',
      toastShared: '공유가 완료됐어요',
      toastFail: '이미지 생성에 실패했어요',
      vcardOrg: '충청남도서부장애인종합복지관;ID&R지원단',
      vcardTitle: 'ID&R지원단 팀장 · 책임언어재활사',
      vcardAddrParts: ['보령북로 404 주교면', '보령시', '충남', '33447', '대한민국'],
      vcardNote: '장애인의 "개성있는 삶"에 동행협업합니다',
      fnFamily: '오',
      fnGiven: '윤영',
      fnJoiner: ''
    },
    en: {
      // TODO: 검수 후 수정 — 이름/회사명/직위 초벌 번역입니다.
      tagline: 'Walking alongside people with disabilities for an "individual life"~',
      org: 'Chungnam Seobu Comprehensive Welfare Center for the Disabled',
      name: 'Oh Yunyoung',
      title: 'ID&R Support Team, Team Leader · Chief Speech-Language Pathologist',
      biz: ['Language Activities'],
      faxLabel: 'Fax',
      addr: '404 Boryeongbuk-ro, Jugyo-myeon, Boryeong-si, Chungnam, 33447, South Korea',
      slogan: 'Filling the world with love',
      qrHint: 'Scan to save contact',
      callBtn: 'Call',
      mailBtn: 'Email',
      saveBtn: 'Save as Image',
      saveBtnBusy: 'Generating...',
      shareTitle: 'Oh Yunyoung — Digital Business Card',
      fileName: 'business_card.png',
      toastCopied: 'Copied',
      toastCopyFail: 'Copy failed',
      toastSaved: 'Saved — check your downloads',
      toastShared: 'Shared successfully',
      toastFail: 'Failed to generate image',
      vcardOrg: 'Chungnam Seobu Comprehensive Welfare Center for the Disabled;ID&R Support Team',
      vcardTitle: 'ID&R Support Team, Team Leader · Chief Speech-Language Pathologist',
      vcardAddrParts: ['404 Boryeongbuk-ro, Jugyo-myeon', 'Boryeong-si', 'Chungnam', '33447', 'South Korea'],
      vcardNote: 'Walking alongside people with disabilities for an "individual life"',
      fnFamily: 'Oh',
      fnGiven: 'Yunyoung',
      fnJoiner: ' '
    }
  };

  var currentLang = 'ko';

  function escVCard(str){
    return String(str).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }

  function buildVCard(lang){
    var c = CONTENT[lang];
    var addr = c.vcardAddrParts.map(escVCard).join(";");
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + escVCard(c.fnFamily) + ";" + escVCard(c.fnGiven) + ";;;",
      "FN:" + escVCard(c.fnFamily + c.fnJoiner + c.fnGiven),
      "ORG:" + c.vcardOrg,
      "TITLE:" + escVCard(c.vcardTitle),
      "TEL;TYPE=CELL:010-4548-8085",
      "TEL;TYPE=WORK,VOICE:041-927-5197",
      "TEL;TYPE=WORK,FAX:041-934-7242",
      "EMAIL;TYPE=INTERNET:slp1915@gmail.com",
      "URL:http://www.westrc.or.kr",
      "ADR;TYPE=WORK:;;" + addr,
      "NOTE:" + escVCard(c.vcardNote),
      "END:VCARD"
    ];
    return lines.join("\r\n");
  }

  function renderQR(lang){
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    var qr = qrcode(0, "L");
    qr.addData(buildVCard(lang));
    qr.make();
    document.getElementById("qrcode").innerHTML = qr.createSvgTag(5, 0);
  }

  function applyLanguage(lang){
    var c = CONTENT[lang];
    document.getElementById('txtTagline').textContent = c.tagline;
    document.getElementById('txtOrg').textContent = c.org;
    document.getElementById('txtName').textContent = c.name;
    document.getElementById('txtTitle').textContent = c.title;
    document.querySelectorAll('#bizList li').forEach(function(el, i){ el.textContent = c.biz[i]; });
    document.getElementById('txtFaxLabel').textContent = c.faxLabel;
    document.getElementById('txtAddr').textContent = c.addr;
    document.getElementById('txtSlogan').textContent = c.slogan;
    document.getElementById('txtQrHint').textContent = c.qrHint;
    document.getElementById('txtCallBtn').textContent = c.callBtn;
    document.getElementById('txtMailBtn').textContent = c.mailBtn;
    document.getElementById('txtSaveBtn').textContent = c.saveBtn;
    document.getElementById('langKoBtn').classList.toggle('active', lang === 'ko');
    document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
    document.documentElement.lang = (lang === 'ko' ? 'ko' : 'en');
    renderQR(lang);
    currentLang = lang;
    fitTagline();
  }

  // ---- 태그라인 한 줄 맞춤: 넘치면 물결(~)이 다음 줄로 밀리기 전에 글자 크기를 줄여준다 ----
  function fitTagline(){
    var el = document.getElementById('txtTagline');
    var maxSize = 11.5;
    var minSize = 8.5;
    var size = maxSize;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > minSize) {
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
  }
  window.addEventListener('resize', fitTagline);

  document.getElementById('langKoBtn').addEventListener('click', function(){ applyLanguage('ko'); });
  document.getElementById('langEnBtn').addEventListener('click', function(){ applyLanguage('en'); });

  applyLanguage('ko');

  // ---- 전화번호 복사 ----
  function showToast(msg, ms){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2200);
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  document.getElementById('copyPhoneBtn').addEventListener('click', function(){
    copyText('010-4548-8085').then(function(){
      showToast(CONTENT[currentLang].toastCopied);
    }).catch(function(){
      showToast(CONTENT[currentLang].toastCopyFail);
    });
  });

  // ---- 명함 이미지 저장 ----
  function downloadBlob(blob, fileName){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function roundCorners(canvas, cssRadius, cssWidth){
    var scale = canvas.width / cssWidth;
    var r = cssRadius * scale;
    var out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    var ctx = out.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(out.width, 0, out.width, out.height, r);
    ctx.arcTo(out.width, out.height, 0, out.height, r);
    ctx.arcTo(0, out.height, 0, 0, r);
    ctx.arcTo(0, 0, out.width, 0, r);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(canvas, 0, 0);
    return out;
  }

  document.getElementById('saveCardBtn').addEventListener('click', function(){
    var btn = this;
    var label = document.getElementById('txtSaveBtn');
    var langRow = document.querySelector('.lang-row');
    btn.disabled = true;
    label.textContent = CONTENT[currentLang].saveBtnBusy;
    langRow.style.visibility = 'hidden';

    var cardEl = document.querySelector('.card');

    Promise.resolve()
      .then(function(){
        return html2canvas(cardEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      })
      .then(function(canvas){
        var rounded = roundCorners(canvas, 22, cardEl.offsetWidth);
        return new Promise(function(resolve){ rounded.toBlob(resolve, 'image/png'); });
      })
      .then(function(blob){
        var c = CONTENT[currentLang];
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var file = null;
        try { file = new File([blob], c.fileName, { type: 'image/png' }); } catch (e) { file = null; }

        if (isMobile && file && navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: c.shareTitle })
            .then(function(){ showToast(c.toastShared); })
            .catch(function(shareErr){
              if (shareErr && shareErr.name === 'AbortError') return;
              downloadBlob(blob, c.fileName);
              showToast(c.toastSaved);
            });
        }
        downloadBlob(blob, c.fileName);
        showToast(c.toastSaved);
      })
      .catch(function(){
        showToast(CONTENT[currentLang].toastFail);
      })
      .then(function(){
        langRow.style.visibility = '';
        btn.disabled = false;
        label.textContent = CONTENT[currentLang].saveBtn;
      });
  });
</script>

</body>
